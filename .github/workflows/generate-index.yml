name: Generate Index

on:
  push:
    paths:
      - 'Puzzles/**.html'
      - '**_icon.PNG'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Run generate_index.py
        run: python generate_index.py

      - name: Commit and push changes
        env:
          PAT: ${{ secrets.PAT }}
        run: |
          git config --global user.name "auto-updater"
          git config --global user.email "auto-updater@example.com"
          git remote set-url origin https://x-access-token:${PAT}@github.com/${{ github.repository }}
          git add index.html
          git commit -m "Auto-update index.html" || echo "No changes to commit"
          git push origin HEAD:main

  
