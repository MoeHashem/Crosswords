<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Puzzle HTML Generator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 2rem;
      max-width: 700px;
      margin: auto;
    }
    input, textarea {
      width: 100%;
      padding: 8px;
      margin: 8px 0 16px 0;
    }
    button {
      padding: 10px 20px;
      font-size: 1rem;
    }
    pre {
      background: #f4f4f4;
      padding: 1rem;
      white-space: pre-wrap;
      word-break: break-word;
    }
  </style>
</head>
<body>
  <h1>🧩 Crossword Puzzle HTML Generator</h1>

  <label for="puzzleNum">Puzzle Number (e.g., CW3):</label>
  <input type="text" id="puzzleNum" placeholder="CW3">

  <label for="title">Custom Title:</label>
  <input type="text" id="title" placeholder="Movie Quotes">

  <label for="iframeSrc">PuzzleMe Embed Snippet or URL:</label>
  <textarea id="iframeSrc" rows="4" placeholder="Paste PuzzleMe iframe embed code OR just the URL here..."></textarea>

  <button onclick="generate()">Generate HTML</button>

  <h2>Generated HTML:</h2>
  <pre id="output"></pre>

  <script>
    function generate() {
      const puzzleNum = document.getElementById("puzzleNum").value.trim();
      const title = document.getElementById("title").value.trim();
      const iframeInput = document.getElementById("iframeSrc").value.trim();

      const fullTitle = `${puzzleNum} – ${title}`;
      const srcMatch = iframeInput.match(/src="([^"]+)"/);
      const iframeSrc = srcMatch ? srcMatch[1] : (iframeInput.startsWith("http") ? iframeInput : "");

      if (!iframeSrc) {
        document.getElementById("output").textContent = "❌ Could not extract a valid iframe src URL.";
        return;
      }

      const html = `<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>${fullTitle}</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      text-align: center;
    }
    header {
      display: flex;
      align-items: center;
      background-color: #f4f4f4;
      padding: 10px;
    }
    .back-button {
      text-decoration: none;
      background-color: #ddd;
      color: #333;
      padding: 8px 12px;
      border-radius: 5px;
      font-size: 14px;
      margin-right: auto;
      margin-left: 10px;
    }
    h1 {
      flex-grow: 1;
      font-size: 1.5em;
      margin: 0;
    }
    iframe {
      border: none;
      width: 100%;
      height: 700px;
      max-width: 900px;
      margin: 20px auto;
      display: block;
    }
    .signup-form-container {
      max-width: 500px;
      margin: 40px auto;
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    #thank-you-message {
      display: none;
      margin-top: 20px;
      color: #28a745;
      font-weight: bold;
      opacity: 0;
      transition: opacity 0.5s ease;
    }
  </style>
</head>
<body>
  <header>
    <a class="back-button" href="../index.html">← Home</a>
    <h1>${fullTitle}</h1>
  </header>

  <iframe 
    src="${iframeSrc}" 
    allow="web-share; fullscreen"
    aria-label="Puzzle Me Game">
  </iframe>

  <!-- Email signup form -->
  <div class="signup-form-container">
    <form id="signup-form" action="https://formspree.io/f/xvgapvlk" method="POST" onsubmit="handleFormSubmit(event)">
      <label style="display: block; margin-bottom: 10px; font-weight: bold;">
        Notify me for new crosswords?
        <input type="email" name="email" required placeholder="you@example.com" style="width: 90%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;" />
      </label>
      <button type="submit" style="padding: 10px 20px; background: #333; color: white; border: none; border-radius: 4px; cursor: pointer;">
        Subscribe
      </button>
      <div id="thank-you-message">
        Thank you for signing up! You'll be notified about new crosswords.
      </div>
    </form>
  </div>

  <script>
    function handleFormSubmit(event) {
      event.preventDefault();
      const successMessage = document.getElementById('thank-you-message');
      successMessage.style.display = 'block';
      setTimeout(() => {
        successMessage.style.opacity = '1';
      }, 10);
      document.getElementById('signup-form').reset();
    }
  </script>
</body>
</html>`;

      document.getElementById("output").textContent = html;
    }
  </script>
</body>
</html>
