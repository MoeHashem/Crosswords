<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crossword Collection</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 0;
      background: #f9f9f9;
    }
    header {
      background-color: #333;
      color: #fff;
      padding: 20px;
      text-align: center;
    }
    h1 {
      margin: 0;
      font-size: 2em;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 20px;
      padding: 30px;
      max-width: 1000px;
      margin: auto;
    }
    .card {
      background: white;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      transition: transform 0.2s;
      text-align: center;
      padding: 15px;
    }
    .card:hover {
      transform: translateY(-5px);
    }
    .card img {
      max-width: 100%;
      height: auto;
      border-radius: 8px;
    }
    .card p {
      margin-top: 10px;
      font-weight: bold;
      color: #333;
    }
    a {
      text-decoration: none;
      color: inherit;
    }
  </style>
</head>
<body>
  <header>
    <h1>My Crossword Collection</h1>
  </header>
  <div class="grid">
    <a href="Puzzles/CW1.html" class="card">
      <img src="Icons/CW1_icon.png" alt="Icons/CW1_icon.png icon">
      <p>CW1</p>
    </a>
    <a href="Puzzles/test.html" class="card">
      <img src="Icons/test_icon.png" alt="Icons/test_icon.png icon">
      <p>test</p>
    </a>
    <a href="Puzzles/test3.html" class="card">
      <img src="Icons/test3_icon.png" alt="Icons/test3_icon.png icon">
      <p>test3</p>
    </a>
  </div>
</body>
</html>
