    header {

      padding: 20px;
      text-align: center;
    }
    h1 {
      margin: 0;
      font-size: 2em;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 20px;
      padding: 30px;
      max-width: 1000px;
      margin: auto;
    }
    .card {
      background: white;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      transition: transform 0.2s;
      text-align: center;
      padding: 15px;
      position: relative;
    }
    .card:hover {
      transform: translateY(-5px);
    }
    .icon-wrapper {
      width: 100%;
      aspect-ratio: 1 / 1;
      background: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      border-radius: 8px;
    }
    .icon-wrapper img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      background-color: white;
    }
    .card p {
      margin-top: 10px;
      font-weight: bold;
      color: #333;
    }
    a {
      text-decoration: none;
      color: inherit;
    }
    /* Floating button styles */
    .floating-btn {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background-color: #333;
      color: #fff;
      padding: 10px 20px;
      border-radius: 50px;
      cursor: pointer;
      font-size: 1rem;
    }
  </style>

  <!-- Email signup form -->
<div style="max-width: 500px; margin: 40px auto; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1);">
  <form id="signup-form" action="https://formspree.io/f/xvgapvlk" method="POST">
    <label style="display: block; margin-bottom: 10px; font-weight: bold;">
      Notify me for new crosswords?
      <input type="email" name="email" required placeholder="you@example.com" style="width: 90%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;" />
    </label>
    <button type="submit" style="padding: 10px 20px; background: #333; color: white; border: none; border-radius: 4px; cursor: pointer;">
      Subscribe
    </button>
    <div id="thank-you-message" style="display: none; margin-top: 20px; color: #28a745; font-weight: bold;">
      Thank you for signing up! You'll be notified about new crosswords.
    </div>
  </form>
</div>

<script>
  document.getElementById('signup-form').addEventListener('submit', async function (event) {
    event.preventDefault(); // Stop default form submission

    const form = event.target;
    const data = new FormData(form);

    try {
      const response = await fetch(form.action, {
        method: form.method,
        body: data,
        headers: {
          'Accept': 'application/json'
        }
      });

      if (response.ok) {
        document.getElementById('thank-you-message').style.display = 'block';
        form.reset();
      } else {
        alert('Oops! There was a problem submitting your form.');
      }
    } catch (error) {
      alert('There was a network error. Please try again later.');
    }
  });
</script>

  <!-- Floating button to pick random puzzle -->
  <button class="floating-btn" onclick="pickRandomPuzzle()">Pick a Random Puzzle</button>

  <script>
  function pickRandomPuzzle() {
    const puzzles = document.querySelectorAll('.grid a.card');

    if (puzzles.length === 0) {
      console.log("No puzzles found!");
      alert("No puzzles found!");
      return;
    }

    const randomPuzzle = puzzles[Math.floor(Math.random() * puzzles.length)];
    const randomPuzzleUrl = randomPuzzle.getAttribute('href');

    console.log("Redirecting to:", randomPuzzleUrl);
    if (randomPuzzleUrl) {
      window.location.href = randomPuzzleUrl;
    } else {
      alert("Invalid puzzle link!");
    }
  }
</script>
