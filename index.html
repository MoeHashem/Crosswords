<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crossword Collection</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 0;
      background: #f9f9f9;
    }
    header {
      background-color: #333;
      color: #fff;
      padding: 20px;
      text-align: center;
    }
    h1 {
      margin: 0;
      font-size: 2em;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 20px;
      padding: 30px;
      max-width: 1000px;
      margin: auto;
    }
    .card {
      background: white;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      transition: transform 0.2s;
      text-align: center;
      padding: 15px;
      position: relative;
    }
    .card:hover {
      transform: translateY(-5px);
    }
    .icon-wrapper {
      width: 100%;
      aspect-ratio: 1 / 1;
      background: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      border-radius: 8px;
    }
    .icon-wrapper img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      background-color: white;
    }
    .card p {
      margin-top: 10px;
      font-weight: bold;
      color: #333;
    }
    a {
      text-decoration: none;
      color: inherit;
    }
    /* Floating button styles */
    .floating-btn {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background-color: #333;
      color: #fff;
      padding: 10px 20px;
      border-radius: 50px;
      cursor: pointer;
      font-size: 1rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>Moe's Mighty Crossword Collection</h1>
  </header>
  <div class="grid">
    <a href="Puzzles/CW01.html" class="card">
      <div class="icon-wrapper">
        <img src="Icons/CW01_icon.png" alt="CW01 icon">
      </div>
      <p>CW01</p>
    </a>
    <a href="Puzzles/CW02.html" class="card">
      <div class="icon-wrapper">
        <img src="Icons/CW02_icon.png" alt="CW02 icon">
      </div>
      <p>CW02</p>
    </a>
    <a href="Puzzles/CW03.html" class="card">
      <div class="icon-wrapper">
        <img src="Icons/CW03_icon.png" alt="CW03 icon">
      </div>
      <p>CW03</p>
    </a>
    <a href="Puzzles/CW04.html" class="card">
      <div class="icon-wrapper">
        <img src="Icons/CW04_icon.png" alt="CW04 icon">
      </div>
      <p>CW04</p>
    </a>
    <a href="Puzzles/CW05.html" class="card">
      <div class="icon-wrapper">
        <img src="Icons/CW05_icon.png" alt="CW05 icon">
      </div>
      <p>CW05</p>
    </a>
    <a href="Puzzles/CW06.html" class="card">
      <div class="icon-wrapper">
        <img src="Icons/CW06_icon.png" alt="CW06 icon">
      </div>
      <p>CW06</p>
    </a>
    <a href="Puzzles/CW7.html" class="card">
      <div class="icon-wrapper">
        <img src="Icons/default_icon.png" alt="CW7 icon">
      </div>
      <p>CW7</p>
    </a>
    <a href="Puzzles/CW8.html" class="card">
      <div class="icon-wrapper">
        <img src="Icons/default_icon.png" alt="CW8 icon">
      </div>
      <p>CW8</p>
    </a>
    <a href="Puzzles/CW9.html" class="card">
      <div class="icon-wrapper">
        <img src="Icons/default_icon.png" alt="CW9 icon">
      </div>
      <p>CW9</p>
    </a>
    <a href="Puzzles/test.html" class="card">
      <div class="icon-wrapper">
        <img src="Icons/test_icon.png" alt="test icon">
      </div>
      <p>test</p>
    </a>
  </div>

  <!-- Floating button to pick random puzzle -->
  <button class="floating-btn" onclick="pickRandomPuzzle()">Pick a Random Puzzle</button>

  <script>
  function pickRandomPuzzle() {
    const puzzles = document.querySelectorAll('.grid a.card');

    if (puzzles.length === 0) {
      console.log("No puzzles found!");
      alert("No puzzles found!");
      return;
    }

    const randomPuzzle = puzzles[Math.floor(Math.random() * puzzles.length)];
    const randomPuzzleUrl = randomPuzzle.getAttribute('href');

    console.log("Redirecting to:", randomPuzzleUrl);
    if (randomPuzzleUrl) {
      window.location.href = randomPuzzleUrl;
    } else {
      alert("Invalid puzzle link!");
    }
  }
</script>

</body>
</html>
