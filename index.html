<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crossword Collection</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 0;
      background: #f9f9f9;
    }
    header {
      background-color: #333;
      color: #fff;
      padding: 20px;
      text-align: center;
    }
    h1 {
      margin: 0;
      font-size: 2em;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 20px;
      padding: 30px;
      max-width: 1000px;
      margin: auto;
    }
    .card {
      background: white;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      transition: transform 0.2s;
      text-align: center;
      padding: 15px;
      position: relative;
    }
    .card:hover {
      transform: translateY(-5px);
    }
    .icon-wrapper {
      width: 100%;
      aspect-ratio: 1 / 1;
      background: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      border-radius: 8px;
    }
    .icon-wrapper img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      background-color: white;
    }
    .card p {
      margin-top: 10px;
      font-weight: bold;
      color: #333;
    }
    a {
      text-decoration: none;
      color: inherit;
    }
    /* Floating button styles */
    .floating-btn {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background-color: #333;
      color: #fff;
      padding: 10px 20px;
      border-radius: 50px;
      cursor: pointer;
      font-size: 1rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>Moe's Mighty Crossword Collection</h1>
  </header>
  <div class="grid">
    <a href="Puzzles/CW1.html" class="card">
      <div class="icon-wrapper">
        <img src="Icons/CW1_icon.png" alt="CW1 icon">
      </div>
      <p>CW1</p>
    </a>
    <a href="Puzzles/CW2.html" class="card">
      <div class="icon-wrapper">
        <img src="Icons/CW2_icon.png" alt="CW2 icon">
      </div>
      <p>CW2</p>
    </a>
    <a href="Puzzles/CW3.html" class="card">
      <div class="icon-wrapper">
        <img src="Icons/CW3_icon.png" alt="CW3 icon">
      </div>
      <p>CW3</p>
    </a>
    <a href="Puzzles/CW4.html" class="card">
      <div class="icon-wrapper">
        <img src="Icons/CW4_icon.png" alt="CW4 icon">
      </div>
      <p>CW4</p>
    </a>
    <a href="Puzzles/CW5.html" class="card">
      <div class="icon-wrapper">
        <img src="Icons/CW5_icon.png" alt="CW5 icon">
      </div>
      <p>CW5</p>
    </a>
    <a href="Puzzles/CW6.html" class="card">
      <div class="icon-wrapper">
        <img src="Icons/CW6_icon.png" alt="CW6 icon">
      </div>
      <p>CW6</p>
    </a>
    <a href="Puzzles/CW7.html" class="card">
      <div class="icon-wrapper">
        <img src="Icons/CW7_icon.png" alt="CW7 icon">
      </div>
      <p>CW7</p>
    </a>
    <a href="Puzzles/CW8.html" class="card">
      <div class="icon-wrapper">
        <img src="Icons/CW8_icon.png" alt="CW8 icon">
      </div>
      <p>CW8</p>
    </a>
    <a href="Puzzles/test.html" class="card">
      <div class="icon-wrapper">
        <img src="Icons/test_icon.png" alt="test icon">
      </div>
      <p>test</p>
    </a>
  </div>

  <!-- Floating button to pick random puzzle -->
  <button class="floating-btn" onclick="pickRandomPuzzle()">Pick a Random Puzzle</button>

  <script>
    function pickRandomPuzzle() {
      // Select all the .card elements (since each <a> tag has class="card")
      const puzzles = document.querySelectorAll('.card');
      
      // If there are no puzzles, return
      if (puzzles.length === 0) {
        alert("No puzzles found!");
        return;
      }
    
      // Pick a random puzzle by selecting a random index
      const randomPuzzle = puzzles[Math.floor(Math.random() * puzzles.length)];
    
      // Get the href attribute of the <a> tag inside the .card
      const randomPuzzleUrl = randomPuzzle.querySelector('a').getAttribute('href');
    
      // Check if the randomPuzzleUrl is valid
      if (randomPuzzleUrl) {
        // Redirect to the selected puzzle's href URL
        window.location.href = randomPuzzleUrl;
      } else {
        alert("Invalid puzzle link!");
      }
    }
  </script>
</body>
</html>
