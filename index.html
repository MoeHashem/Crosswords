<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crossword Collection</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 0;
      background: #f9f9f9;
    }
    header {
      background-color: #333;
      color: #fff;
      padding: 20px;
      text-align: center;
    }
    h1 {
      margin: 0;
      font-size: 2em;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 20px;
      padding: 30px;
      max-width: 1000px;
      margin: auto;
    }
    .card {
      background: white;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      transition: transform 0.2s;
      text-align: center;
      padding: 15px;
      position: relative;
    }
    .card:hover {
      transform: translateY(-5px);
    }
    .icon-wrapper {
      width: 100%;
      aspect-ratio: 1 / 1;
      background: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      border-radius: 8px;
    }
    .icon-wrapper img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      background-color: white;
    }
    .card p {
      margin-top: 10px;
      font-weight: bold;
      color: #333;
    }
    a {
      text-decoration: none;
      color: inherit;
    }
  </style>
</head>
<body>
  <header>
    <h1>Moe's Mighty Crossword Collection</h1>
  </header>
  <div class="grid">
    <a href="Puzzles/CW1.html" class="card">
      <div class="icon-wrapper">
        <img src="Icons/CW1_icon.png" alt="CW1 icon">
      </div>
      <p>CW1</p>
    </a>
    <a href="Puzzles/CW2.html" class="card">
      <div class="icon-wrapper">
        <img src="Icons/CW2_icon.png" alt="CW2 icon">
      </div>
      <p>CW2</p>
    </a>
    <a href="Puzzles/CW3.html" class="card">
      <div class="icon-wrapper">
        <img src="Icons/CW3_icon.png" alt="CW3 icon">
      </div>
      <p>CW3</p>
    </a>
    <a href="Puzzles/CW4.html" class="card">
