<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CW21 – A Good Day For Rain</title>
  <link rel="icon" href="../favicon.png" type="image/png" />
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      text-align: center;
      background: #f9f9f9;
    }
    iframe {
      border: none;
      width: 100%;
      height: 700px;
      max-width: 900px;
      margin: 20px auto;
      display: block;
    }
    .signup-form-container {
      max-width: 500px;
      margin: 40px auto;
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    #thank-you-message {
      display: none;
      margin-top: 20px;
      color: #28a745;
      font-weight: bold;
      opacity: 0;
      transition: opacity 0.5s ease;
    }
  </style>
</head>
<body>
  <a href="../index.html" style="position: absolute; top: 10px; left: 10px; font-size: 1.2rem; text-decoration: none; background: #F7CD36; padding: 8px 12px; border-radius: 4px; color: #333;">← Home</a>
  <h1>CW21 – A Good Day For Rain</h1>
  <iframe 
    src="https://puzzleme.amuselabs.com/pmm/crossword?id=e8189612&set=026ee68fcbb58c6eba48b8fe700822811a8062b259bfae8ce8b531e0bc87b626&embed=1" 
    allow="web-share; fullscreen"
    aria-label="Puzzle Me Game">
  </iframe>

  <div class="signup-form-container">
    <form id="signup-form" action="https://formspree.io/f/xvgapvlk" method="POST">
      <label style="display: block; margin-bottom: 10px; font-weight: bold;">
        Notify me for new crosswords?
        <input type="email" name="email" required placeholder="you@example.com" style="width: 90%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;" />
      </label>
      <button type="submit" style="padding: 10px 20px; background: #F7CD36; color: #bbb; border: none; border-radius: 4px; cursor: pointer;">
        Subscribe
      </button>
      <div id="thank-you-message">
        Thank you for signing up! You'll be notified about new crosswords.
      </div>
    </form>
  </div>

  <script>
    document.getElementById('signup-form').addEventListener('submit', async function (event) {
      event.preventDefault();

      const form = event.target;
      const data = new FormData(form);
      const thankYouMessage = document.getElementById('thank-you-message');

      try {
        const response = await fetch(form.action, {
          method: form.method,
          body: data,
          headers: { 'Accept': 'application/json' }
        });

        if (response.ok) {
          thankYouMessage.style.display = 'block';
          setTimeout(() => {
            thankYouMessage.style.opacity = '1';
          }, 10);
          form.reset();
        } else {
          alert('Oops! Something went wrong. Please try again.');
        }
      } catch (error) {
        alert('Network error. Please try again later.');
      }
    });
  </script>
</body>
</html>
